<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>模式A · VLM 车辆安全检查</title>
<style>
:root{
  --bg1:#eef1f6; --bg2:#e6ecf5; --bg3:#f6eef2;
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.38);
  --stroke:rgba(255,255,255,.55); --stroke2:rgba(0,0,0,.06);
  --text:#0b0b0f; --text2:rgba(11,11,15,.56); --text3:rgba(11,11,15,.38);
  --accent:#0a84ff; --warn:#ff9f0a; --crit:#ff453a; --ok:#30d158;
  --shadow:0 8px 30px rgba(20,25,45,.10), 0 1px 2px rgba(20,25,45,.05);
  --r:22px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#0b0f16; --bg2:#111722; --bg3:#1a1220;
    --glass:rgba(30,34,44,.55); --glass2:rgba(30,34,44,.38);
    --stroke:rgba(255,255,255,.18); --stroke2:rgba(255,255,255,.06);
    --text:#f5f6fa; --text2:rgba(245,246,250,.6); --text3:rgba(245,246,250,.4);
    --shadow:0 10px 34px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  color:var(--text); background:var(--bg1);
  background-image:
    radial-gradient(70% 55% at 12% 0%, var(--bg3) 0%, transparent 60%),
    radial-gradient(80% 60% at 100% 8%, var(--bg2) 0%, transparent 62%);
  background-attachment:fixed;
  min-height:100vh; padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--stroke); border-radius:var(--r); box-shadow:var(--shadow);
  padding:16px 16px;
}
header.glass{padding:18px 18px 16px}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{font-size:13px;color:var(--text2);margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--stroke2);
  background:var(--glass2);color:var(--text2);white-space:nowrap;
}
.pill.real{color:#0a7c34;border-color:rgba(48,209,88,.35);background:rgba(48,209,88,.14)}
.pill.sim{color:#8a5a00;border-color:rgba(255,159,10,.4);background:rgba(255,159,10,.16)}
@media (prefers-color-scheme:dark){.pill.real{color:#7ee2a0}.pill.sim{color:#ffcf7a}}
h2{font-size:13px;font-weight:600;color:var(--text2);margin:0 0 10px;letter-spacing:.02em}
video,canvas#shot{width:100%;border-radius:16px;display:block;background:rgba(120,120,140,.14);aspect-ratio:4/3;object-fit:cover}
canvas#shot{display:none}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{
  font:inherit;font-size:14px;font-weight:500;color:var(--text);
  background:var(--glass2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--stroke); border-radius:14px; padding:11px 16px; cursor:pointer;
  transition:transform .12s ease, opacity .12s ease; flex:1 1 auto; min-width:96px;
}
button:active{transform:scale(.975)}
button:disabled{opacity:.42;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(10,132,255,.28)}
select{
  font:inherit;font-size:13px;color:var(--text);background:var(--glass2);
  border:1px solid var(--stroke);border-radius:12px;padding:9px 11px;width:100%;
  -webkit-appearance:none;appearance:none;
}
label.fld{display:block;font-size:12px;color:var(--text3);margin:0 0 5px}
.banner{
  border-radius:18px;padding:14px 16px;margin:0;display:none;
  border:1px solid transparent;font-weight:600;font-size:15px;
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
}
.banner.show{display:block;animation:pop .34s cubic-bezier(.2,.9,.3,1.2)}
.banner .small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:3px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.banner.warn{background:rgba(255,159,10,.18);border-color:rgba(255,159,10,.42);color:#8a5a00}
.banner.crit{background:rgba(255,69,58,.18);border-color:rgba(255,69,58,.45);color:#a3231a}
.banner.ok{background:rgba(48,209,88,.16);border-color:rgba(48,209,88,.38);color:#0a7c34}
@media (prefers-color-scheme:dark){
  .banner.warn{color:#ffcf7a}.banner.crit{color:#ff9a92}.banner.ok{color:#7ee2a0}
}
.ev{border-radius:16px;border:1px solid var(--stroke2);background:var(--glass2);padding:12px 13px;margin-bottom:9px}
.ev:last-child{margin-bottom:0}
.ev .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.crit{background:var(--crit)}.dot.warn{background:var(--warn)}.dot.info{background:var(--accent)}
.ev .m{font-size:12.5px;color:var(--text2);margin-top:5px;line-height:1.45}
.ev .m b{font-weight:600;color:var(--text)}
.feed{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fi{display:flex;gap:9px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--stroke2)}
.fi:last-child{border-bottom:none}
.fi .ch{flex:none;font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--glass2);border:1px solid var(--stroke2);color:var(--text2);height:fit-content}
.fi .tx{flex:1;min-width:0;color:var(--text2)}
.fi .tx b{color:var(--text);font-weight:600}
.muted{color:var(--text3);font-size:12.5px;margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--stroke2)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--text2)}
.kv span:last-child{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
details.raw{margin-top:10px}
details.raw summary{font-size:12.5px;color:var(--text2);cursor:pointer;list-style:none}
details.raw summary::-webkit-details-marker{display:none}
details.raw pre{font-size:11px;line-height:1.45;overflow-x:auto;background:var(--glass2);border:1px solid var(--stroke2);border-radius:12px;padding:10px;margin:8px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--text2)}
footer{text-align:center;font-size:11.5px;color:var(--text3);padding:4px 8px 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--text3);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>模式A · 大模型看图安全检查</h1>
    <p class="sub">拍一张车内照片，由视觉大模型抽取结构化观测，规则层判定违规，再走车内提醒 + 后台上报双通道。</p>
    <div class="row" style="margin-top:11px" id="badges">
      <span class="pill"><span class="spin"></span>正在读取后端状态…</span>
    </div>
  </header>

  <section class="glass">
    <h2>1 · 采集</h2>
    <video id="cam" playsinline autoplay muted></video>
    <canvas id="shot"></canvas>
    <div class="btns">
      <button id="btnCam">打开摄像头</button>
      <button id="btnShot" class="primary" disabled>拍照并检测</button>
      <button id="btnSample">用示例图</button>
    </div>
    <div id="mockBox" style="margin-top:12px;display:none">
      <label class="fld">Mock 场景（仅无 API key 时生效）</label>
      <select id="scenario"></select>
    </div>
  </section>

  <div id="banner" class="banner"></div>

  <section class="glass">
    <h2>2 · 检测结果</h2>
    <div id="events"><p class="muted">尚未检测。</p></div>
    <div id="meta"></div>
    <details class="raw" id="rawBox" style="display:none">
      <summary>查看模型原始回答与结构化观测</summary>
      <pre id="raw"></pre>
    </details>
  </section>

  <section class="glass">
    <h2>3 · 告警流水（车内 + 后台）</h2>
    <div class="feed" id="feed"><p class="muted">暂无告警。</p></div>
    <div class="btns"><button id="btnClear">清空流水</button></div>
  </section>

  <footer>
    模式A 演示 · 事件结构遵循 common/ 契约层 SafetyEvent v1.1<br>
    页面上标注「模拟」时表示 VLM 推理为预置返回，其余环节均为真实代码。
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
let health = null, stream = null;

function badge(txt, cls){ const s=document.createElement('span'); s.className='pill'+(cls?' '+cls:''); s.textContent=txt; return s; }

async function loadHealth(){
  try{
    health = await (await fetch('/api/health')).json();
    const b = $('#badges'); b.innerHTML='';
    b.appendChild(badge(health.simulated ? '模拟推理（无 API key）' : '真实模型推理', health.simulated?'sim':'real'));
    b.appendChild(badge('后端 ' + health.provider.provider));
    b.appendChild(badge(health.provider.model || '—'));
    b.appendChild(badge('车辆 ' + health.vehicle_id));
    if(health.simulated){ $('#mockBox').style.display='block'; loadScenarios(); }
  }catch(e){ $('#badges').innerHTML=''; $('#badges').appendChild(badge('后端不可达：'+e.message)); }
}
async function loadScenarios(){
  try{
    const d = await (await fetch('/api/scenarios')).json();
    $('#scenario').innerHTML = d.scenarios.map(s=>`<option value="${s.name}">${s.name} — ${s.desc}</option>`).join('');
  }catch(e){}
}

$('#btnCam').onclick = async () => {
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    $('#cam').srcObject = stream; $('#cam').style.display='block'; $('#shot').style.display='none';
    $('#btnShot').disabled = false; $('#btnCam').textContent='摄像头已开启';
  }catch(e){
    alert('无法访问摄像头（'+e.name+'）。手机浏览器要求 HTTPS 或 localhost；可改用「用示例图」。');
  }
};

function drawSample(){
  const c = $('#shot'), w=640, h=480; c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.fillStyle='#1c1c1e'; g.fillRect(0,0,w,h);
  g.fillStyle='#34302a'; g.fillRect(0,0,w,150);
  g.fillStyle='#26221e'; g.fillRect(0,380,w,h-380);
  g.strokeStyle='#46464e'; g.lineWidth=12; g.beginPath(); g.ellipse(190,400,90,70,0,0,Math.PI*2); g.stroke();
  // 驾驶员：未系安全带
  g.fillStyle='#606c84'; g.beginPath(); g.ellipse(190,370,78,90,0,0,Math.PI*2); g.fill();
  g.fillStyle='#d6b094'; g.beginPath(); g.arc(190,202,48,0,Math.PI*2); g.fill();
  g.fillStyle='#fff'; [172,208].forEach(x=>{g.beginPath();g.ellipse(x,196,9,8,0,0,Math.PI*2);g.fill();});
  g.fillStyle='#1e1e1e'; [172,208].forEach(x=>{g.beginPath();g.arc(x,196,4,0,Math.PI*2);g.fill();});
  g.strokeStyle='#7a3c3c'; g.lineWidth=4; g.beginPath(); g.moveTo(176,232); g.lineTo(204,232); g.stroke();
  // 乘客：已系安全带
  g.fillStyle='#606c84'; g.beginPath(); g.ellipse(450,370,78,90,0,0,Math.PI*2); g.fill();
  g.strokeStyle='#26262c'; g.lineWidth=11; g.beginPath(); g.moveTo(384,320); g.lineTo(508,392); g.stroke();
  g.fillStyle='#d6b094'; g.beginPath(); g.arc(450,202,48,0,Math.PI*2); g.fill();
  g.fillStyle='#fff'; [432,468].forEach(x=>{g.beginPath();g.ellipse(x,196,9,8,0,0,Math.PI*2);g.fill();});
  g.fillStyle='#1e1e1e'; [432,468].forEach(x=>{g.beginPath();g.arc(x,196,4,0,Math.PI*2);g.fill();});
  c.style.display='block'; $('#cam').style.display='none';
  return c.toDataURL('image/jpeg', .85);
}

$('#btnSample').onclick = () => { detect(drawSample()); };

$('#btnShot').onclick = () => {
  const v = $('#cam'), c = $('#shot');
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  c.style.display='block'; v.style.display='none';
  detect(c.toDataURL('image/jpeg', .85));
};

$('#btnClear').onclick = async () => { await fetch('/api/alerts/clear',{method:'POST'}); loadFeed(); };

function showBanner(events){
  const b = $('#banner');
  if(!events.length){
    b.className='banner ok show';
    b.innerHTML='未发现违规<span class="small">本次检查通过。判不了的项见下方「无法判定」。</span>';
    return;
  }
  const crit = events.some(e=>e.severity==='critical');
  const top = events[0];
  b.className='banner ' + (crit?'crit':'warn') + ' show';
  b.innerHTML = (crit?'⚠ 严重违规 · ':'提醒 · ') + top.message +
    `<span class="small">车内播报已触发${crit?'（循环 3 次 + 蜂鸣）':'（提醒 1 次）'}；共 ${events.length} 条事件已上报后台。</span>`;
  if(navigator.vibrate) navigator.vibrate(crit?[220,90,220,90,220]:[130]);
}

async function detect(dataUrl){
  $('#btnShot').disabled = true; $('#btnSample').disabled = true;
  $('#events').innerHTML = '<p class="muted"><span class="spin"></span>模型分析中…</p>';
  $('#meta').innerHTML=''; $('#banner').className='banner';
  const body = {image: dataUrl};
  if(health && health.simulated) body.scenario = $('#scenario').value || null;
  try{
    const r = await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || ('HTTP '+r.status));
    render(d);
  }catch(e){
    $('#events').innerHTML = '<p class="muted">检测失败：'+e.message+'</p>';
  }finally{
    $('#btnShot').disabled = !stream; $('#btnSample').disabled = false;
    loadFeed();
  }
}

function render(d){
  const ev = $('#events');
  if(!d.ok){
    ev.innerHTML = '<p class="muted">本次未产生结论：' + (d.notes||[]).join('；') + '</p>';
  }else if(!d.events.length){
    ev.innerHTML = '<p class="muted">未检出违规。</p>';
  }else{
    ev.innerHTML = d.events.map(e=>`
      <div class="ev">
        <div class="t"><span class="dot ${e.severity}"></span>${e.message}</div>
        <div class="m">等级 <b>${e.severity}</b> · 置信 <b>${(e.confidence*100).toFixed(0)}%</b> · 座位 <b>${(e.subject.seat||'—')}</b><br>
        模型依据：${e.raw_signals.evidence_text || '—'}</div>
      </div>`).join('');
  }
  showBanner(d.events||[]);

  const u = (d.undecidable||[]).map(x=>`<div class="kv"><span>${x.violation}</span><span>${x.reason}</span></div>`).join('');
  const im = (d.images||[])[0] || {};
  $('#meta').innerHTML = `
    ${u ? '<h2 style="margin:14px 0 6px">无法判定（不等于合规）</h2>'+u : ''}
    <h2 style="margin:14px 0 6px">本次运行</h2>
    <div class="kv"><span>推理来源</span><span>${d.simulated?'模拟（预置返回）':'真实模型'} · ${d.vlm?d.vlm.model:'—'}</span></div>
    <div class="kv"><span>模型耗时</span><span>${d.timings_ms.vlm||0} ms</span></div>
    <div class="kv"><span>端到端</span><span>${d.server_ms||d.timings_ms.total||0} ms</span></div>
    <div class="kv"><span>token</span><span>入 ${d.vlm?(d.vlm.prompt_tokens??'—'):'—'} / 出 ${d.vlm?(d.vlm.completion_tokens??'—'):'—'}</span></div>
    <div class="kv"><span>图片</span><span>${im.original||'—'} → ${im.width||'?'}×${im.height||'?'}（约 ${im.est_vision_tokens||'?'} 视觉 token）</span></div>
    ${(d.notes||[]).map(n=>`<div class="kv"><span>备注</span><span>${n}</span></div>`).join('')}`;

  $('#rawBox').style.display='block';
  $('#raw').textContent = (d.vlm && d.vlm.text ? d.vlm.text : '(无原始回答)') +
    '\n\n--- 归一化后的结构化观测 ---\n' + JSON.stringify(d.observations, null, 1);
}

async function loadFeed(){
  try{
    const d = await (await fetch('/api/alerts?limit=40')).json();
    const f = $('#feed');
    if(!d.records.length){ f.innerHTML='<p class="muted">暂无告警。</p>'; return; }
    f.innerHTML = d.records.map(r=>{
      const t = new Date(r.ts*1000).toLocaleTimeString('zh-CN',{hour12:false});
      const ch = r.channel==='in_cabin' ? '车内' : '后台';
      return `<div class="fi"><span class="ch">${ch}</span><span class="tx"><b>${r.text}</b><br>${t} · ${r.severity} · ${r.delivered?'已投递':'投递失败，已落盘待补传'}</span></div>`;
    }).join('');
  }catch(e){}
}

loadHealth(); loadFeed(); setInterval(loadFeed, 5000);
</script>
</body>
</html>
